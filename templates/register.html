<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kayıt Ol | MaviGPT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf9ff, #f8fdff);
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px 28px;
            border-radius: 25px;
            box-shadow: 0 15px 45px rgba(70, 160, 195, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 55px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            margin: 0;
            color: #238bb5;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #71838b;
            margin: 10px 0 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #385764;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d6eaf2;
            border-radius: 13px;
            outline: none;
            font-size: 15px;
            margin-bottom: 18px;
            background: #fafdfe;
        }

        input:focus {
            border-color: #8ed5ee;
            box-shadow: 0 0 0 3px rgba(142, 213, 238, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #98daf5;
            color: #17495c;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7dcdec;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #71838b;
        }

        .login a {
            color: #238bb5;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            background: #fff1f1;
            color: #c54b4b;
            padding: 11px;
            border-radius: 10px;
            margin-bottom: 18px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">🩵</div>

    <h1>MaviGPT</h1>

    <p class="subtitle">
        Yeni hesabını oluştur
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label for="username">
            Kullanıcı adı
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Kullanıcı adın"
            autocomplete="username"
            required
        >

        <label for="display_name">
            Görünen ad
        </label>

        <input
            type="text"
            id="display_name"
            name="display_name"
            placeholder="Adın"
            autocomplete="name"
        >

        <label for="password">
            Şifre
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Şifren"
            autocomplete="new-password"
            required
        >

        <label for="password2">
            Şifre tekrar
        </label>

        <input
            type="password"
            id="password2"
            name="password2"
            placeholder="Şifreni tekrar yaz"
            autocomplete="new-password"
            required
        >

        <button type="submit">
            Hesap Oluştur
        </button>

    </form>

    <div class="login">
        Zaten hesabın var mı?
        <a href="/login">
            Giriş Yap
        </a>
    </div>

</div>

</body>
</html>
