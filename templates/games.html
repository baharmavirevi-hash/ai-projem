<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oyunlar | MaviGPT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff7ff, #f4fbff);
            color: #234;
            padding: 25px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .header p {
            color: #667;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,.08);
            transition: .2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        .game-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .game-card h2 {
            margin-bottom: 10px;
        }

        .game-card p {
            color: #667;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 15px;
            background: #78cdea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #54b9df;
        }

        #gameArea {
            display: none;
            margin-top: 25px;
            background: white;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,.08);
        }

        .score {
            font-size: 22px;
            margin: 15px 0;
        }

        #target {
            display: none;
            position: relative;
            margin: 30px auto;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #78cdea;
            cursor: pointer;
        }

        .back {
            margin-top: 15px;
            background: #aaa;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎮 MaviGPT Oyun Merkezi</h1>
        <p>İnternetsiz mini oyunlar burada! 💙</p>
    </div>

    <div class="games">

        <div class="game-card">
            <div class="game-icon">🎯</div>

            <h2>Hedefi Yakala</h2>

            <p>
                Hedef ekranda belirecek.
                Ne kadar hızlı tıklarsan o kadar puan!
            </p>

            <button onclick="startGame()">
                Oyna 🎮
            </button>
        </div>

        <div class="game-card">
            <div class="game-icon">🧠</div>

            <h2>Yakında...</h2>

            <p>
                Yeni oyunlar üzerinde çalışıyoruz.
            </p>

            <button disabled>
                Çok Yakında
            </button>
        </div>

    </div>

    <div id="gameArea">

        <h2>🎯 Hedefi Yakala!</h2>

        <div class="score">
            Puan: <span id="score">0</span>
        </div>

        <p>
            30 saniyede mümkün olduğunca çok hedef yakala!
        </p>

        <div id="timer">
            Süre: 30
        </div>

        <div id="target" onclick="hitTarget()"></div>

        <button class="back" onclick="closeGame()">
            Oyundan Çık
        </button>

    </div>

</div>

<script>

let score = 0;
let time = 30;
let timer;
let playing = false;

function startGame() {

    score = 0;
    time = 30;
    playing = true;

    document.getElementById("score").textContent = score;
    document.getElementById("timer").textContent = "Süre: " + time;

    document.getElementById("gameArea").style.display = "block";
    document.getElementById("target").style.display = "block";

    moveTarget();

    clearInterval(timer);

    timer = setInterval(() => {

        time--;

        document.getElementById("timer").textContent =
            "Süre: " + time;

        if (time <= 0) {

            clearInterval(timer);

            playing = false;

            document.getElementById("target").style.display = "none";

            alert(
                "Oyun bitti! 🎉\n\nPuanın: " + score
            );
        }

    }, 1000);
}


function hitTarget() {

    if (!playing) return;

    score++;

    document.getElementById("score").textContent = score;

    moveTarget();
}


function moveTarget() {

    const target = document.getElementById("target");

    const maxX = 250;
    const maxY = 250;

    const x = Math.random() * maxX - maxX / 2;
    const y = Math.random() * maxY - maxY / 2;

    target.style.transform =
        `translate(${x}px, ${y}px)`;
}


function closeGame() {

    clearInterval(timer);

    playing = false;

    document.getElementById("gameArea").style.display = "none";
    document.getElementById("target").style.display = "none";
}

</script>

</body>
</html>
