<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐔 Tavuklu Wi-Fi</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #dff7ff,
            #f5fcff
        );

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.game {
    width: 100%;
    max-width: 750px;

    background: white;

    border-radius: 25px;

    padding: 20px;

    text-align: center;

    box-shadow:
        0 10px 35px rgba(0,0,0,.12);
}

h1 {
    margin: 5px 0;
}

.info {
    display: flex;
    justify-content: center;

    gap: 30px;

    margin: 15px 0;

    font-size: 20px;
    font-weight: bold;
}

#message {
    min-height: 30px;

    font-weight: bold;
}

#farm {

    position: relative;

    width: 100%;
    height: 400px;

    overflow: hidden;

    border-radius: 20px;

    border: 4px solid white;

    background:
        linear-gradient(
            to bottom,
            #8edfff 0%,
            #8edfff 40%,
            #82cf76 40%,
            #82cf76 100%
        );
}

#chicken {

    position: absolute;

    width: 65px;
    height: 65px;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 55px;

    left: 50px;
    top: 300px;

    user-select: none;

    z-index: 10;
}

.item {

    position: absolute;

    width: 55px;
    height: 55px;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 42px;

    user-select: none;

    z-index: 5;
}

#controls {

    margin-top: 15px;

    color: #555;
}

button {

    border: none;

    border-radius: 14px;

    padding: 12px 22px;

    margin-top: 15px;

    background: #78cdea;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #54b9df;
}

</style>
</head>


<body>


<div class="game">

    <h1>
        🐔📶 Tavuklu Wi-Fi
    </h1>

    <p>
        Wi-Fi'ları yakala, altın yumurtaları bul! 🥚
    </p>


    <div class="info">

        <span>
            📶
            <span id="score">0</span>
        </span>

        <span>
            🥚
            <span id="eggs">0</span>
        </span>

        <span>
            ⏱️
            <span id="time">30</span>
        </span>

    </div>


    <div id="message">
        🐔 Başla!
    </div>


    <div id="farm">

        <div id="chicken">
            🐔
        </div>

        <div
            id="wifi"
            class="item"
        >
            📶
        </div>

        <div
            id="egg"
            class="item"
        >
            🥚
        </div>

    </div>


    <div id="controls">

        ⬅️ ⬆️ ⬇️ ➡️

        <br>

        Ok tuşlarıyla tavuğu hareket ettir!

    </div>


    <button onclick="restartGame()">
        🔄 Yeniden Başlat
    </button>

</div>


<script>


/* =====================================================
   DEĞİŞKENLER
===================================================== */

let chickenX = 50;
let chickenY = 300;

let wifiX = 300;
let wifiY = 150;

let eggX = 500;
let eggY = 200;

let score = 0;

let eggScore = 0;

let time = 30;

let gameRunning = true;

const speed = 8;


const chicken =
    document.getElementById("chicken");

const wifi =
    document.getElementById("wifi");

const egg =
    document.getElementById("egg");

const farm =
    document.getElementById("farm");

const scoreText =
    document.getElementById("score");

const eggsText =
    document.getElementById("eggs");

const timeText =
    document.getElementById("time");

const message =
    document.getElementById("message");


/* =====================================================
   TAVUK
===================================================== */

function updateChicken() {

    chicken.style.left =
        chickenX + "px";

    chicken.style.top =
        chickenY + "px";

}


/* =====================================================
   RASTGELE KONUM
===================================================== */

function randomPosition() {

    const maxX =
        farm.clientWidth - 60;

    const maxY =
        farm.clientHeight - 60;

    return {

        x: Math.floor(
            Math.random() * maxX
        ),

        y: Math.floor(
            Math.random() * maxY
        )

    };

}


/* =====================================================
   WI-FI YER DEĞİŞTİR
===================================================== */

function moveWifi() {

    const position =
        randomPosition();

    wifiX = position.x;
    wifiY = position.y;

    wifi.style.left =
        wifiX + "px";

    wifi.style.top =
        wifiY + "px";

}


/* =====================================================
   ALTIN YUMURTA YER DEĞİŞTİR
===================================================== */

function moveEgg() {

    const position =
        randomPosition();

    eggX = position.x;
    eggY = position.y;

    egg.style.left =
        eggX + "px";

    egg.style.top =
        eggY + "px";

}


/* =====================================================
   OK TUŞLARI
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (!gameRunning) {
            return;
        }


        if (
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight" ||
            event.key === "ArrowUp" ||
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            chickenX -= speed;

        }


        if (
            event.key === "ArrowRight"
        ) {

            chickenX += speed;

        }


        if (
            event.key === "ArrowUp"
        ) {

            chickenY -= speed;

        }


        if (
            event.key === "ArrowDown"
        ) {

            chickenY += speed;

        }


        /* SINIRLAR */

        const maxX =
            farm.clientWidth -
            chicken.offsetWidth;

        const maxY =
            farm.clientHeight -
            chicken.offsetHeight;


        chickenX =
            Math.max(
                0,
                Math.min(
                    chickenX,
                    maxX
                )
            );


        chickenY =
            Math.max(
                0,
                Math.min(
                    chickenY,
                    maxY
                )
            );


        updateChicken();

        checkCollisions();

    }
);


/* =====================================================
   ÇARPIŞMALAR
===================================================== */

function checkCollisions() {


    const chickenRect =
        chicken.getBoundingClientRect();


    /* -----------------------------
       WI-FI
    ----------------------------- */

    const wifiRect =
        wifi.getBoundingClientRect();


    const hitWifi =

        chickenRect.left <
        wifiRect.right &&

        chickenRect.right >
        wifiRect.left &&

        chickenRect.top <
        wifiRect.bottom &&

        chickenRect.bottom >
        wifiRect.top;


    if (hitWifi) {

        score++;

        scoreText.textContent =
            score;

        message.textContent =
            "📶 WI-FI YAKALANDI! +1";


        moveWifi();

    }


    /* -----------------------------
       ALTIN YUMURTA
    ----------------------------- */

    const eggRect =
        egg.getBoundingClientRect();


    const hitEgg =

        chickenRect.left <
        eggRect.right &&

        chickenRect.right >
        eggRect.left &&

        chickenRect.top <
        eggRect.bottom &&

        chickenRect.bottom >
        eggRect.top;


    if (hitEgg) {

        score += 5;

        eggScore++;

        scoreText.textContent =
            score;

        eggsText.textContent =
            eggScore;


        message.textContent =
            "🥚✨ ALTIN YUMURTA! +5";


        moveEgg();

    }

}


/* =====================================================
   OYUNU YENİDEN BAŞLAT
===================================================== */

function restartGame() {

    score = 0;

    eggScore = 0;

    time = 30;

    gameRunning = true;


    chickenX = 50;

    chickenY = 300;


    scoreText.textContent =
        score;

    eggsText.textContent =
        eggScore;

    timeText.textContent =
        time;


    message.textContent =
        "🐔 Wi-Fi'ları ve altın yumurtaları yakala!";


    updateChicken();

    moveWifi();

    moveEgg();

}


/* =====================================================
   SÜRE
===================================================== */

setInterval(
    function() {

        if (!gameRunning) {
            return;
        }


        time--;


        timeText.textContent =
            time;


        if (time <= 0) {

            gameRunning = false;


            message.textContent =
                "🏁 OYUN BİTTİ! " +
                "Toplam skor: " +
                score +
                " 🐔";


        }

    },
    1000
);


/* =====================================================
   BAŞLANGIÇ
===================================================== */

updateChicken();

moveWifi();

moveEgg();

</script>

</body>
</html>
