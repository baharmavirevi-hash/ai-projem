<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#58b9d8">

    <title>İlaçlarım | Cebimdeki Doktor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #eaf8ff, #ffffff);
            color: #23404d;
            min-height: 100vh;
        }

        /* MENÜ */

        #menuButton {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 52px;
            height: 52px;
            border: none;
            border-radius: 16px;
            background: white;
            color: #287b98;
            font-size: 27px;
            box-shadow: 0 8px 25px rgba(30,90,120,.15);
            z-index: 9999;
            cursor: pointer;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.35);
            display: none;
            z-index: 5000;
        }

        #overlay.open {
            display: block;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 290px;
            max-width: 85vw;
            height: 100vh;
            background: white;
            padding: 20px 15px;
            transform: translateX(-100%);
            transition: transform .25s ease;
            box-shadow: 8px 0 30px rgba(0,0,0,.15);
            z-index: 9000;
            overflow-y: auto;
        }

        #sidebar.open {
            transform: translateX(0);
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 800;
            color: #287b98;
        }

        #closeButton {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 13px;
            background: #edf8fc;
            color: #287b98;
            font-size: 25px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 13px;
            width: 100%;
            padding: 15px;
            margin-bottom: 8px;
            border-radius: 16px;
            text-decoration: none;
            color: #345562;
            font-size: 15px;
            font-weight: 700;
        }

        .menu-item.active,
        .menu-item:hover {
            background: #dff4fa;
            color: #287b98;
        }

        .menu-icon {
            width: 30px;
            text-align: center;
            font-size: 22px;
        }

        /* SAYFA */

        .page {
            width: 100%;
            max-width: 800px;
            margin: auto;
            padding: 90px 15px 40px;
        }

        .hero {
            text-align: center;
            margin-bottom: 25px;
        }

        .medicine-icon {
            width: 75px;
            height: 75px;
            margin: auto auto 12px;
            border-radius: 24px;
            background: #def4fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            font-size: 38px;
            color: #20596f;
        }

        .subtitle {
            margin-top: 8px;
            color: #728994;
            font-size: 14px;
        }

        /* BİLDİRİM */

        .notification-card,
        .add-card {
            background: white;
            border: 1px solid #e3f0f5;
            border-radius: 22px;
            padding: 17px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(30,90,120,.08);
        }

        .notification-title {
            font-weight: 800;
            color: #285f72;
            font-size: 17px;
            margin-bottom: 7px;
        }

        .notification-text {
            color: #718893;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        #notificationStatus {
            padding: 11px;
            border-radius: 13px;
            background: #f3f9fb;
            color: #617b85;
            font-size: 13px;
            text-align: center;
            margin-bottom: 10px;
        }

        #notificationButton {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 15px;
            background: #4faeca;
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        #notificationButton.enabled {
            background: #56b987;
        }

        /* FORM */

        .card-title {
            font-size: 19px;
            font-weight: 800;
            color: #315e6d;
            margin-bottom: 15px;
        }

        .field {
            margin-bottom: 13px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            color: #54707b;
            font-size: 13px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            height: 50px;
            border: 1.5px solid #dcecf2;
            border-radius: 15px;
            padding: 0 14px;
            background: #fbfeff;
            color: #294653;
            font-size: 15px;
            outline: none;
        }

        .save-button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg,#58b9d8,#287d9c);
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        /* İLAÇLAR */

        .section-title {
            margin: 10px 3px 12px;
            font-size: 19px;
            font-weight: 800;
            color: #426371;
        }

        .medicine-card {
            background: white;
            border: 1px solid #e3f0f5;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: 0 7px 22px rgba(30,90,120,.07);
        }

        .medicine-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .medicine-name {
            color: #285f72;
            font-size: 17px;
            font-weight: 800;
        }
