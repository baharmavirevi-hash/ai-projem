<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>İlaçlarım | Cebimdeki Doktor</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #eef8ff 0%,
                    #f8fcff 100%
                );

            color: #17212b;
        }


        /* =====================================================
           HAMBURGER
        ===================================================== */

        .menu-button {

            position: fixed;

            top: 16px;
            left: 16px;

            width: 50px;
            height: 50px;

            border: none;
            border-radius: 16px;

            background: rgba(255,255,255,0.95);

            color: #176f99;

            font-size: 26px;

            box-shadow:
                0 8px 25px rgba(40,90,130,0.14);

            cursor: pointer;

            z-index: 1001;

            -webkit-tap-highlight-color: transparent;

            transition: 0.2s;
        }

        .menu-button:active {
            transform: scale(0.94);
        }


        /* =====================================================
           OVERLAY
        ===================================================== */

        .overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.32);

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

            z-index: 999;
        }

        .overlay.active {

            opacity: 1;

            visibility: visible;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {

            position: fixed;

            top: 0;
            left: 0;

            width: 290px;

            height: 100vh;

            background:
                rgba(255,255,255,0.98);

            backdrop-filter: blur(18px);

            box-shadow:
                10px 0 35px rgba(0,0,0,0.12);

            transform:
                translateX(-105%);

            transition:
                transform 0.28s ease;

            z-index: 1000;

            padding:
                82px 16px 25px;

            overflow-y: auto;
        }

        .sidebar.active {

            transform:
                translateX(0);
        }


        .sidebar-title {

            font-size: 14px;

            font-weight: 800;

            color: #8b9aaa;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin:
                0 10px 14px;
        }


        .menu-link {

            display: flex;

            align-items: center;

            gap: 14px;

            text-decoration: none;

            color: #253444;

            padding:
                15px 16px;

            border-radius: 16px;

            margin-bottom: 7px;

            font-size: 15px;

            font-weight: 600;

            transition: 0.2s;

            -webkit-tap-highlight-color:
                transparent;
        }

        .menu-link:hover {

            background: #eaf5ff;
        }

        .menu-link:active {

            transform: scale(0.98);
        }

        .menu-link.active {

            background: #dcefff;

            color: #1685d8;
        }


        .menu-icon {

            width: 30px;

            text-align: center;

            font-size: 22px;
        }


        /* =====================================================
           ANA SAYFA
        ===================================================== */

        .page {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding:
                92px 18px 45px;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            text-align: center;

            margin-bottom: 28px;
        }


        .hero-icon {

            width: 78px;
            height: 78px;

            margin:
                0 auto 14px;

            border-radius: 25px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #dff5ff,
                    #c9ecff
                );

            font-size: 42px;

            box-shadow:
                0 12px 30px
                rgba(50,150,220,0.13);
        }


        .hero h1 {

            font-size:
                clamp(30px, 7vw, 46px);

            font-weight: 800;

            letter-spacing: -1.2px;

            color: #152c3d;
        }


        .hero p {

            margin-top: 9px;

            color: #637585;

            font-size: 16px;

            line-height: 1.5;
        }


        /* =====================================================
           ANA KART
        ===================================================== */

        .main-card {

            background:
                rgba(255,255,255,0.95);

            border:
                1px solid rgba(150,190,220,0.28);

            border-radius: 27px;

            padding: 20px;

            box-shadow:
                0 15px 45px
                rgba(35,90,130,0.11);
        }


        /* =====================================================
           MESAJ
        ===================================================== */

        .message {

            padding:
                13px 15px;

            border-radius: 16px;

            margin-bottom: 18px;

            font-size: 14px;

            line-height: 1.5;
        }


        .message.success {

            background: #eafaf2;

            color: #227d53;

            border:
                1px solid #c9eedc;
        }


        .message.error {

            background: #fff0f0;

            color: #b23b3b;

            border:
                1px solid #f3cece;
        }


        /* =====================================================
           FORM BAŞLIĞI
        ===================================================== */

        .section-title {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 15px;
        }


        .section-title-icon {

            width: 42px;
            height: 42px;

            border-radius: 13px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #e8f7ff;

            font-size: 22px;
        }


        .section-title h2 {

            font-size: 20px;

            color: #203746;
        }


        .section-title p {

            margin-top: 2px;

            font-size: 12px;

            color: #82919b;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .medicine-form {

            display: flex;

            flex-direction: column;

            gap: 13px;
        }


        .field {

            display: flex;

            flex-direction: column;

            gap: 6px;
        }


        .field label {

            font-size: 13px;

            font-weight: 700;

            color: #526571;
        }


        .field input {

            width: 100%;

            height: 51px;

            border:
                1.5px solid #d9e7ef;

            border-radius: 15px;

            background: #fbfdff;

            padding:
                0 14px;

            font-size: 15px;

            color: #17212b;

            outline: none;

            transition: 0.2s;
        }


        .field input:focus {

            border-color: #62b5e5;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(98,181,229,0.11);
        }


        .form-row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }


        /* =====================================================
           EKLE BUTONU
        ===================================================== */

        .add-button {

            width: 100%;

            min-height: 53px;

            border: none;

            border-radius: 16px;

            margin-top: 3px;

            background:
                linear-gradient(
                    135deg,
                    #59b5e8,
                    #328fc9
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 9px 22px
                rgba(50,150,220,0.22);

            transition: 0.2s;
        }


        .add-button:hover {

            transform:
                translateY(-1px);
        }


        .add-button:active {

            transform:
                scale(0.98);
        }


        /* =====================================================
           AYIRICI
        ===================================================== */

        .divider {

            height: 1px;

            background: #e7eef3;

            margin:
                25px 0;
        }


        /* =====================================================
           KAYITLAR
        ===================================================== */

        .records-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 14px;
        }


        .records-header h2 {

            font-size: 20px;

            color: #203746;
        }


        .record-count {

            background: #e8f6ff;

            color: #2886b7;

            border-radius: 20px;

            padding:
                6px 10px;

            font-size: 12px;

            font-weight: 700;
        }


        /* =====================================================
           BOŞ DURUM
        ===================================================== */

        .empty {

            text-align: center;

            padding:
                30px 15px;

            background: #f7fbfe;

            border:
                1px dashed #d7e7ef;

            border-radius: 18px;
        }


        .empty-icon {

            font-size: 35px;

            margin-bottom: 8px;
        }


        .empty strong {

            display: block;

            color: #405561;

            margin-bottom: 5px;
        }


        .empty span {

            color: #8998a1;

            font-size: 13px;

            line-height: 1.5;
        }


        /* =====================================================
           İLAÇ KARTI
        ===================================================== */

        .medicine-list {

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .medicine-card {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            background: white;

            border:
                1px solid #e2edf3;

            border-radius: 20px;

            padding: 16px;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,0.055);

            transition: 0.2s;
        }


        .medicine-card:hover {

            box-shadow:
                0 8px 23px
                rgba(35,100,140,0.09);
        }


        .medicine-info {

            min-width: 0;

            flex: 1;
        }


        .medicine-name {

            display: flex;

            align-items: center;

            gap: 8px;

            color: #243a49;

            font-size: 16px;

            font-weight: 800;

            word-break: break-word;
        }


        .medicine-name-icon {

            width: 37px;
            height: 37px;

            min-width: 37px;

            border-radius: 12px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #eaf7ff;

            font-size: 19px;
        }


        .medicine-details {

            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-top: 10px;
        }


        .detail {

            display: inline-flex;

            align-items: center;

            gap: 4px;

            background: #f3f8fb;

            color: #667984;

            border-radius: 10px;

            padding:
                6px 8px;

            font-size: 12px;

            font-weight: 600;
        }


        /* =====================================================
           SİL BUTONU
        ===================================================== */

        .delete-form {

            flex-shrink: 0;
        }


        .delete-button {

            border: none;

            border-radius: 12px;

            padding:
                10px 12px;

            background: #fff1f1;

            color: #d15353;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;

            -webkit-tap-highlight-color:
                transparent;
        }


        .delete-button:hover {

            background: #ffe2e2;
        }


        .delete-button:active {

            transform:
                scale(0.94);
        }


        /* =====================================================
           ALT BİLGİ
        ===================================================== */

        .safety-note {

            margin-top: 18px;

            padding:
                12px 14px;

            border-radius: 15px;

            background: #f4f9fc;

            color: #788994;

            font-size: 11px;

            line-height: 1.5;

            text-align: center;
        }


        /* =====================================================
           MOBİL
        ===================================================== */

        @media (max-width: 600px) {

            .menu-button {

                top: 13px;
                left: 13px;

                width: 48px;
                height: 48px;

                border-radius: 15px;

                font-size: 24px;
            }


            .sidebar {

                width:
                    min(290px, 84vw);

                padding:
                    78px 14px 22px;
            }


            .page {

                padding:
                    82px 11px 30px;
            }


            .hero {

                margin-bottom: 22px;
            }


            .hero-icon {

                width: 68px;
                height: 68px;

                border-radius: 22px;

                font-size: 36px;
            }


            .hero h1 {

                font-size: 32px;
            }


            .hero p {

                font-size: 14px;

                padding:
                    0 8px;
            }


            .main-card {

                padding: 14px;

                border-radius: 22px;
            }


            .form-row {

                grid-template-columns:
                    1fr;
            }


            .field input {

                height: 49px;
            }


            .medicine-card {

                align-items:
                    flex-start;

                padding: 14px;

                gap: 10px;
            }


            .medicine-name {

                font-size: 15px;
            }


            .medicine-name-icon {

                width: 34px;
                height: 34px;

                min-width: 34px;
            }


            .delete-button {

                padding:
                    9px 10px;

                font-size: 12px;
            }


            .records-header h2 {

                font-size: 18px;
            }
        }


        @media (max-width: 380px) {

            .medicine-card {

                flex-direction: column;
            }


            .delete-form {

                width: 100%;
            }


            .delete-button {

                width: 100%;
            }
        }

    </style>

</head>
