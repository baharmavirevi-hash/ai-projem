<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>İlaçlarım | Cebimdeki Doktor</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #eef8ff 0%,
                    #f8fcff 100%
                );

            color: #172b3a;
        }

        /* =====================================================
           HAMBURGER
        ===================================================== */

        .menu-button {

            position: fixed;

            top: 18px;
            left: 18px;

            width: 52px;
            height: 52px;

            border: none;
            border-radius: 16px;

            background: rgba(255,255,255,0.96);

            color: #287b99;

            font-size: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 8px 25px rgba(35,90,130,0.14);

            cursor: pointer;

            z-index: 2001;

            -webkit-tap-highlight-color: transparent;

            transition:
                transform 0.15s ease,
                background 0.2s ease;
        }

        .menu-button:active {
            transform: scale(0.94);
        }

           OVERLAY
        ===================================================== */

            inset: 0;
