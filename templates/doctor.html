<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cebimdeki Doktor</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=7">

</head>


<body>


<div class="app">


<div class="sidebar">

<div class="logo">
🌊 MaviGPT
</div>


<button class="new-chat" onclick="location.href='/'">
＋ Yeni Sohbet
</button>


<div class="chat-item">
🩺 Cebimdeki Doktor
</div>


</div>





<main class="chat">


<button class="menu-btn" onclick="toggleMenu()">
☰
</button>




<header class="header">

<h2>🩺 Cebimdeki Doktor</h2>

<p>MaviGPT sağlık yardımcın</p>

</header>





<section class="messages">


<div class="ai">

👋 Merhaba Bahar!

<br><br>

Ben Cebimdeki Doktor.

<br><br>

Belirtilerini yazabilirsin. Sana genel sağlık bilgileri hakkında yardımcı olabilirim.

</div>



{% if mesaj %}

<div class="user">

{{ mesaj }}

</div>

{% endif %}





{% if cevap %}

<div class="ai">

{{ cevap }}

</div>

{% endif %}



</section>





<form class="input-bar"
method="post"
action="/doctor">



<input 
type="text"
name="mesaj"
placeholder="Şikayetini yaz..."
autocomplete="off">



<button type="submit">
➤
</button>



</form>



</main>


</div>





<script>

function toggleMenu(){

document.querySelector(".sidebar")
.classList.toggle("active");

}

</script>


</body>

</html>
