<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>MaviGPT</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f9fc;
            color: #17212b;
            overflow: hidden;
        }

        /* =========================
           ANA UYGULAMA
        ========================= */

        .app {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;

            width: 285px;
            max-width: 82vw;
            height: 100vh;

            background: white;

            border-right: 1px solid #dfe8ee;

            z-index: 1000;

            transform: translateX(-105%);
            transition: transform .25s ease;

            display: flex;
            flex-direction: column;

            box-shadow: 8px 0 30px rgba(0,0,0,.12);

            overflow-y: auto;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            height: 68px;
            min-height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 15px;

            border-bottom: 1px solid #edf2f5;
        }

        .sidebar-title {
            font-size: 19px;
            font-weight: bold;
            color: #0782a8;
        }

        .close-sidebar {
            width: 44px;
            height: 44px;

            border: none;
            border-radius: 13px;

            background: #f1f7fa;
            color: #52636c;

            font-size: 28px;

            cursor: pointer;
        }

        .new-chat {
            margin: 15px;

            padding: 14px;

            border: 1px solid #d5e9f0;
            border-radius: 14px;

            background: #eefaff;
            color: #087c9f;

            font-weight: bold;
            font-size: 15px;

            text-align: left;

            cursor: pointer;
        }

        .menu-section {
            padding: 5px 10px;
        }

        .menu-title {
            padding: 10px;

            font-size: 11px;
            font-weight: bold;

            color: #8997a1;
        }

        .menu-item {
            display: flex;
            align-items: center;

            gap: 12px;

            padding: 13px 11px;
            margin: 3px 0;

            border-radius: 13px;

            color: #25323b;

            text-decoration: none;

            font-size: 14px;
        }

        .menu-item:active,
        .menu-item:hover {
            background: #eef8fb;
        }

        .menu-icon {
            width: 30px;
            min-width: 30px;

            text-align: center;

            font-size: 19px;
        }

        /* =========================
           GEÇMİŞ
        ========================= */

        .history {
            flex: 1;

            padding: 5px 10px 20px;

            overflow-y: auto;
        }

        .history-title {
            padding: 10px;

            font-size: 12px;
            font-weight: bold;

            color: #8997a1;
        }

        .history-item {
            display: block;

            padding: 11px 10px;
            margin-bottom: 4px;

            border-radius: 11px;

            color: #45545e;

            text-decoration: none;

            font-size: 13px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #eef8fb;
        }

        .history-empty {
            padding: 10px;

            color: #8997a1;

            font-size: 13px;
        }

        /* =========================
           KARARTMA
        ========================= */

        .backdrop {
            position: fixed;

            inset: 0;

            background: rgba(0,0,0,.30);

            z-index: 900;

            display: none;
        }

        .backdrop.show {
            display: block;
        }

        /* =========================
           ANA ALAN
        ========================= */

        .main {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 65px;
            min-height: 65px;

            background: white;

            border-bottom: 1px solid #dfe8ee;

            display: flex;
            align-items: center;

            padding: 0 12px;

            gap: 10px;

            z-index: 100;
        }

            width: 45px;
            min-width: 45px;

            height: 45px;
