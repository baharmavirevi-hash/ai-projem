<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>MaviGPT</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f9fc;
            color: #17212b;
            overflow: hidden;
        }

        /* =========================
           ANA UYGULAMA
        ========================= */

        .app {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;

            width: 285px;
            max-width: 82vw;
            height: 100vh;

            background: white;

            border-right: 1px solid #dfe8ee;

            z-index: 2000;

            transform: translateX(-105%);
            transition: transform .28s ease;

            display: flex;
            flex-direction: column;

            box-shadow: 8px 0 30px rgba(0,0,0,.12);

            overflow: hidden;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        /* =========================
           SIDEBAR HEADER
        ========================= */

        .sidebar-header {
            height: 68px;
            min-height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 14px;

            border-bottom: 1px solid #edf2f5;
        }

        .sidebar-title {
            font-size: 19px;
            font-weight: 700;
            color: #0782a8;
        }

        .close-sidebar {
            width: 44px;
            height: 44px;

            border: none;
            border-radius: 13px;

            background: #f1f7fa;
            color: #52636c;

            font-size: 28px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           YENİ SOHBET
        ========================= */

        .new-chat {
            margin: 15px;

            padding: 14px 15px;

            border: 1px solid #d5e9f0;
            border-radius: 14px;

            background: #eefaff;
            color: #087c9f;

            font-weight: 700;
            font-size: 15px;

            text-align: left;

            cursor: pointer;
        }

        /* =========================
           MENÜ
        ========================= */

        .menu-section {
            padding: 2px 10px;
        }

        .menu-title {
            padding: 9px 10px 7px;

            font-size: 11px;
            color: #8997a1;

            font-weight: 700;
        }

        .menu-item {
            display: flex;
            align-items: center;

            gap: 12px;

            width: 100%;

            padding: 13px 11px;
            margin: 3px 0;

            border-radius: 13px;

            color: #25323b;

            text-decoration: none;

            font-size: 14px;

            cursor: pointer;
        }

        .menu-item:active {
            background: #e5f4f8;
        }

        .menu-icon {
            width: 29px;
            min-width: 29px;

            text-align: center;

            font-size: 19px;
        }

        /* =========================
           GEÇMİŞ
        ========================= */

        .history {
            flex: 1;

            overflow-y: auto;

            padding: 5px 10px 25px;
        }

        .history-title {
            padding: 10px;

            font-size: 12px;

            color: #8997a1;

            font-weight: 700;
        }

        .history-item {
            display: block;

            width: 100%;

            padding: 11px 10px;

            margin-bottom: 4px;

            border-radius: 11px;

            color: #45545e;

            font-size: 13px;

            text-decoration: none;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }

        .history-item:active {
            background: #eef8fb;
        }

        .history-empty {
            padding: 10px;

            color: #8997a1;

            font-size: 13px;
        }

        /* =========================
           KARARTMA
        ========================= */

        .backdrop {
            position: fixed;

            inset: 0;

            background: rgba(0,0,0,.30);

            z-index: 1500;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity .25s ease,
                visibility .25s ease;
        }

        .backdrop.show {
            opacity: 1;
            visibility: visible;
        }

        /* =========================
           ANA
        ========================= */

        .main {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            width: 100%;

            height: 65px;
            min-height: 65px;

            background: white;

            border-bottom: 1px solid #dfe8ee;

            display: flex;
            align-items: center;

            padding: 0 12px;

            gap: 10px;

            position: relative;

            z-index: 100;
        }

        /* =========================
           HAMBURGER
        ========================= */

        .menu-button {
            width: 45px;
            min-width: 45px;

            height: 45px;

            border: none;
            border-radius: 14px;

            background: #eef8fb;

            color: #14728d;

            font-size: 27px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-button:active {
            transform: scale(.93);
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 43px;
            min-width: 43px;

            height: 43px;

            border-radius: 14px;

            background: #d9f5ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;
        }

        .header-info {
            min-width: 0;
        }

        .title {
            font-size: 17px;
            font-weight: 700;
        }

        .status {
            color: #29a56f;

            font-size: 11px;

            margin-top: 3px;
        }

        /* =========================
           CHAT
        ========================= */

        .chat {
            flex: 1;

            overflow-y: auto;

            padding: 25px 12px 125px;

            -webkit-overflow-scrolling: touch;
        }

        .chat-inner {
            width: 100%;

            max-width: 850px;

            margin: auto;
        }

        /* =========================
           HOŞ GELDİN
        ========================= */

        .welcome {
            text-align: center;

            margin: 65px auto 40px;

            max-width: 500px;

            padding: 0 10px;
        }

        .welcome-logo {
            width: 75px;
            height: 75px;

            margin: auto;

            border-radius: 24px;

            background: #d9f5ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;
        }

        .welcome h1 {
            margin: 18px 0 8px;

            font-size: 25px;
        }

        .welcome p {
            margin: 0;

            color: #72808a;

            line-height: 1.6;

            font-size: 14px;
        }

        /* =========================
           MESAJ
        ========================= */

        .message {
            width: 100%;

            display: flex;

            gap: 9px;

            margin-bottom: 20px;

            align-items: flex-start;
        }

        .avatar {
            width: 36px;
            min-width: 36px;

            height: 36px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
        }

        .user-avatar {
            background: #e2eaff;
        }

        .bot-avatar {
            background: #d9f5ff;
        }

        .message-content {
            max-width: calc(100% - 45px);

            min-width: 0;
        }

        .message-name {
            font-size: 11px;

            color: #84919a;

            margin: 0 0 5px 3px;
        }
