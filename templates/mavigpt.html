<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>MaviGPT</title>

    <style>

        /* =====================================================
           TEMEL
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f7f9fc;
            color: #172033;

            overflow: hidden;
        }


        /* =====================================================
           UYGULAMA
        ===================================================== */

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }


        /* =====================================================
           ÜST BAR
        ===================================================== */

        .topbar {
            height: 68px;
            min-height: 68px;

            display: flex;
            align-items: center;

            padding: 0 14px;

            background: rgba(255,255,255,0.92);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom: 1px solid #e8edf3;

            position: relative;
            z-index: 20;
        }


        .menu-button {
            width: 46px;
            height: 46px;

            border: none;
            border-radius: 15px;

            background: #f0f6ff;

            color: #1687d9;

            font-size: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: 0.2s;
        }


        .menu-button:active {
            transform: scale(0.92);
        }


        .top-title {
            margin-left: 12px;

            display: flex;
            align-items: center;

            gap: 9px;
        }


        .top-logo {
            width: 40px;
            height: 40px;

            border-radius: 13px;

            background: linear-gradient(
                135deg,
                #68c5ff,
                #318bd8
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;

            box-shadow:
                0 6px 18px rgba(50,145,220,0.22);
        }


        .top-title-text {
            display: flex;
            flex-direction: column;
        }


        .top-title-text strong {
            font-size: 17px;
            line-height: 20px;
        }


        .top-title-text span {
            font-size: 11px;
            color: #8793a3;
        }


        /* =====================================================
           CHAT ALANI
        ===================================================== */

        .chat-area {
            flex: 1;

            overflow-y: auto;

            padding: 25px 14px 125px;

            scroll-behavior: smooth;
        }


        .chat-container {
            width: 100%;
            max-width: 760px;

            margin: 0 auto;
        }


        /* =====================================================
           HOŞ GELDİN
        ===================================================== */

        .welcome {
            text-align: center;

            padding: 30px 12px 25px;
        }


        .welcome-logo {
            width: 78px;
            height: 78px;

            margin: 0 auto 18px;

            border-radius: 26px;

            background:
                linear-gradient(
                    135deg,
                    #69c8ff,
                    #388fdc
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 43px;

            box-shadow:
                0 12px 35px rgba(45,145,220,0.25);
        }


        .welcome h1 {
            font-size: 30px;
            font-weight: 800;

            color: #15283a;

            letter-spacing: -0.8px;

            margin-bottom: 8px;
        }


        .welcome p {
            color: #7a8999;

            font-size: 15px;

            line-height: 1.5;

            max-width: 480px;

            margin: 0 auto;
        }


        /* =====================================================
           MESAJLAR
        ===================================================== */

        .message {
            display: flex;

            margin: 15px 0;

            animation: messageIn 0.25s ease;
        }


        @keyframes messageIn {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        .message.user {
            justify-content: flex-end;
        }


        .message-bubble {
            max-width: 86%;

            padding: 13px 16px;

            border-radius: 20px;

            font-size: 15px;

            line-height: 1.55;

            word-wrap: break-word;

            white-space: pre-wrap;
        }


        .message.user .message-bubble {
            background: #4aa9e8;

            color: white;

            border-bottom-right-radius: 6px;

            box-shadow:
                0 7px 20px rgba(55,155,220,0.18);
        }


        .message.ai .message-bubble {
            background: white;

            color: #263544;

            border: 1px solid #e7edf3;

            border-bottom-left-radius: 6px;

            box-shadow:
                0 5px 18px rgba(30,60,90,0.06);
        }


        .ai-label {
            font-size: 11px;

            font-weight: 700;

            color: #459bd5;

            margin-bottom: 5px;
        }


        /* =====================================================
           FOTOĞRAF
        ===================================================== */

        .uploaded-image {
            max-width: 100%;

            border-radius: 16px;

            margin-top: 10px;

            display: block;
        }


        /* =====================================================
           BOŞ MESAJ
        ===================================================== */

        .empty-space {
            height: 15px;
        }


        /* =====================================================
           ALT GİRİŞ ALANI
        ===================================================== */

        .input-wrapper {

            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            padding:
                10px 12px
                calc(10px + env(safe-area-inset-bottom))
                12px;

            background:
                linear-gradient(
                    to top,
                    #f7f9fc 75%,
                    rgba(247,249,252,0)
                );

            z-index: 30;
        }


        .input-container {

            width: 100%;
            max-width: 760px;

            margin: 0 auto;

            background: white;

            border: 1px solid #dfe7ef;

            border-radius: 23px;

            padding: 7px;

            display: flex;

            align-items: flex-end;

            gap: 6px;

            box-shadow:
                0 8px 30px rgba(30,65,100,0.10);
        }


        /* =====================================================
           FOTOĞRAF BUTONU
        ===================================================== */

        .photo-button {

            width: 44px;
            height: 44px;

            flex-shrink: 0;

            border: none;

            border-radius: 16px;

            background: #f0f6fb;

            color: #3d98d3;

            font-size: 21px;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;
        }


        .photo-button:active {
            transform: scale(0.92);
        }


        #photo {
            display: none;
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .message-input {

            flex: 1;

            min-width: 0;

            max-height: 120px;

            border: none;

            outline: none;

            resize: none;

            background: transparent;

            color: #1c2b38;

            font-family: inherit;

            font-size: 16px;

            line-height: 22px;

            padding:
                11px 7px;

        }


        .message-input::placeholder {
            color: #9ba7b4;
        }


        /* =====================================================
           GÖNDER
        ===================================================== */

        .send-button {

            width: 44px;
            height: 44px;

            flex-shrink: 0;

            border: none;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #63c3fa,
                    #358fd8
                );

            color: white;

            font-size: 21px;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-shadow:
                0 6px 16px rgba(45,145,220,0.25);

            transition: 0.2s;
        }


        .send-button:active {
            transform: scale(0.92);
        }


        /* =====================================================
           FOTOĞRAF ADI
        ===================================================== */

        .selected-file {

            display: none;

            max-width: 760px;

            margin: 0 auto 6px;

            padding: 8px 12px;

            font-size: 12px;

            color: #4b83a7;

            background: #eaf6ff;

            border-radius: 12px;

            width: fit-content;
        }


        .selected-file.show {
            display: block;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(10,25,40,0.38);

            opacity: 0;

            visibility: hidden;

            transition: 0.25s;

            z-index: 90;
        }


        .overlay.active {

            opacity: 1;

            visibility: visible;
        }


        .sidebar {

            position: fixed;

            top: 0;
            left: 0;
