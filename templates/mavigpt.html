<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#75d5f0">

    <title>MaviGPT</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f4fbfe;
            color: #17212b;
        }

        button,
        input {
            font-family: inherit;
        }

        /* ==================================================
           ANA UYGULAMA
        ================================================== */

        .app {
            width: 100%;
            height: 100dvh;
            display: flex;
            overflow: hidden;
        }

        /* ==================================================
           SOL MENÜ
        ================================================== */

        .sidebar {
            width: 285px;
            height: 100%;

            background: white;
            border-right: 1px solid #e2edf1;

            display: flex;
            flex-direction: column;

            flex-shrink: 0;

            z-index: 100;

            transition: transform .25s ease;
        }

        .sidebar-header {
            padding: 18px 15px 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;

            margin-bottom: 17px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;

            border-radius: 14px;

            background: linear-gradient(
                135deg,
                #dff8ff,
                #b8eafa
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
        }

        .brand-subtitle {
            color: #82929a;
            font-size: 11px;
            margin-top: 2px;
        }

        .new-chat {
            width: 100%;

            border: 1px solid #d8e9ef;
            background: #f8fdff;

            color: #21677c;

            border-radius: 13px;

            padding: 12px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }

        .new-chat:active {
            transform: scale(.98);
        }

        .history-title {
            padding: 10px 17px 6px;

            color: #8999a1;

            font-size: 12px;
            font-weight: 600;
        }

        .history {
            flex: 1;
            overflow-y: auto;

            padding: 4px 10px;
        }

        .history-item {
            padding: 11px 12px;

            border-radius: 11px;

            margin-bottom: 3px;

            color: #53636c;

            font-size: 13px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #f2fafc;
        }

        .empty-history {
            padding: 14px 10px;

            color: #9ba9af;

            font-size: 12px;

            line-height: 1.5;
        }

        .sidebar-bottom {
            border-top: 1px solid #edf2f4;

            padding: 10px;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 11px 12px;

            border-radius: 11px;

            text-decoration: none;

            color: #52636c;

            font-size: 13px;
        }

        .menu-link:hover {
            background: #f3fafc;
        }

        /* ==================================================
           ANA ALAN
        ================================================== */

        .main {
            flex: 1;
            min-width: 0;

            height: 100%;

            display: flex;
            flex-direction: column;

            position: relative;
        }

        /* ==================================================
           ÜST BAR
        ================================================== */

        .header {
            height: 65px;
            min-height: 65px;

            background: rgba(255,255,255,.96);

            border-bottom: 1px solid #e2edf1;

            display: flex;
            align-items: center;

            gap: 11px;

            padding: 0 17px;

            z-index: 20;
        }

        .menu-button {
            display: none;

            width: 42px;
            height: 42px;

            border: 0;
            background: transparent;

            border-radius: 12px;

            font-size: 24px;

            color: #425660;

            cursor: pointer;

            align-items: center;
            justify-content: center;
        }

        .menu-button:active {
            background: #edf8fb;
        }

        .header-logo {
            width: 41px;
            height: 41px;

            border-radius: 13px;

            background: #dff7ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
        }

        .online {
            color: #2aa66b;

            font-size: 11px;

            margin-top: 2px;
        }

        /* ==================================================
           SOHBET
        ================================================== */

        .chat {
            flex: 1;

            overflow-y: auto;

            padding: 25px 15px 120px;

            scroll-behavior: smooth;
        }

        .chat-inner {
            width: 100%;
            max-width: 850px;

            margin: 0 auto;
        }

        /* ==================================================
           KARŞILAMA
        ================================================== */

            text-align: center;

            padding-top: 7vh;
            padding-bottom: 35px;
        }

        .welcome-icon {
            width: 72px;

            margin: 0 auto 17px;

            border-radius: 23px;

            background: linear-gradient(
                135deg,
                #dff8ff,
                #b8eafa
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            box-shadow:
                0 8px 25px rgba(70,160,190,.12);
        }
