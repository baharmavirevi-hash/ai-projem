<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#78d6f2">

    <title>MaviGPT</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f5fbfe;
            color: #17212b;
        }


        /* =====================================================
           ANA UYGULAMA
        ===================================================== */

        .app {
            width: 100%;
            height: 100dvh;
            display: flex;
            overflow: hidden;
            position: relative;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            width: 290px;
            height: 100%;
            background: #ffffff;
            border-right: 1px solid #e3edf1;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 100;
            transition: transform .25s ease;
        }


        .sidebar-top {
            padding: 18px 15px 12px;
        }


        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 18px;
        }


        .brand-icon {
            width: 43px;
            height: 43px;
            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #dff8ff,
                    #bceafa
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;
        }


        .brand-name {
            font-size: 18px;
            font-weight: 700;
        }


        .brand-subtitle {
            color: #81919b;
            font-size: 11px;
            margin-top: 2px;
        }


        .new-chat {
            width: 100%;
            border: 1px solid #d8e8ee;
            background: #f7fcfe;
            color: #16647d;

            border-radius: 13px;
            padding: 12px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }


        .new-chat:active {
            transform: scale(.98);
        }


        .sidebar-title {
            padding: 8px 17px;
            color: #84949d;
            font-size: 12px;
            font-weight: 600;
        }


        .history {
            flex: 1;
            overflow-y: auto;
            padding: 4px 10px;
        }


        .history-item {
            padding: 11px 12px;
            border-radius: 11px;
            margin-bottom: 3px;

            color: #53636d;
            font-size: 13px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        .history-item:hover {
            background: #f1f9fc;
        }


        .empty-history {
            padding: 15px 10px;
            color: #9aa8af;
            font-size: 12px;
            line-height: 1.5;
        }


        .sidebar-bottom {
            border-top: 1px solid #edf2f4;
            padding: 12px;
        }


        .menu-link {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 11px 12px;
            border-radius: 11px;

            color: #52636c;
            text-decoration: none;

            font-size: 13px;
        }


        .menu-link:hover {
            background: #f3fafc;
        }


        /* =====================================================
           ANA CHAT
        ===================================================== */

        .main {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            height: 65px;
            min-height: 65px;

            background: rgba(255,255,255,.94);

            border-bottom: 1px solid #e3edf1;

            display: flex;
            align-items: center;

            padding: 0 18px;

            gap: 12px;

            z-index: 20;
        }


        .menu-button {
            width: 42px;
            height: 42px;

            border: 0;
            background: transparent;

            border-radius: 12px;

            font-size: 24px;

            color: #40535e;

            cursor: pointer;

            display: none;

            align-items: center;
            justify-content: center;
        }


        .menu-button:active {
            background: #edf8fb;
        }


        .header-logo {
            width: 40px;
            height: 40px;

            border-radius: 13px;

            background: #dff7ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
        }


        .header-info {
            min-width: 0;
        }


        .header-title {
            font-size: 17px;
            font-weight: 700;
        }


        .online {
            font-size: 11px;
            color: #29a66b;
            margin-top: 2px;
        }


        /* =====================================================
           CHAT ALANI
        ===================================================== */

        .chat {
            flex: 1;
            overflow-y: auto;

            padding: 28px 18px 125px;

            scroll-behavior: smooth;
        }


        .chat-inner {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }


        /* =====================================================
           HOŞ GELDİN
        ===================================================== */

        .welcome {
            text-align: center;
            padding-top: 8vh;
            padding-bottom: 35px;
        }


        .welcome-icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 18px;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    #dff8ff,
                    #b7e9f7
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            box-shadow:
                0 8px 25px rgba(75,170,200,.12);
        }


        .welcome h1 {
            margin: 0;
            font-size: 25px;
        }


        .welcome p {
            margin: 9px 0 0;
            color: #71828b;
            font-size: 14px;
            line-height: 1.6;
        }


        .suggestions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;

            margin-top: 22px;
        }
