<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MaviGPT</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .app {
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* SIDEBAR */

        .sidebar {
            width: 280px;
            background: #ffffff;
            border-right: 1px solid #e6eaf0;
            display: flex;
            flex-direction: column;
            padding: 18px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 20;
            transition: transform .25s ease;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: #dff5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 700;
        }

        .brand-subtitle {
            font-size: 12px;
            color: #7b8495;
            margin-top: 3px;
        }

        .close-sidebar {
            display: none;
            border: 0;
            background: transparent;
            font-size: 23px;
        }

        .new-chat {
            border: 0;
            background: #dff5ff;
            color: #087ea4;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 22px;
        }

        .side-title {
            font-size: 12px;
            color: #8a92a2;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .side-link {
            text-decoration: none;
            color: #263044;
            padding: 13px 12px;
            border-radius: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 5px;
        }

        .side-link:hover {
            background: #f0f8fc;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        /* MAIN */

        .main {
            margin-left: 280px;
            width: calc(100% - 280px);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .header {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e6eaf0;
            display: flex;
            align-items: center;
            padding: 0 22px;
            gap: 15px;
        }

        .menu-button {
            display: none;
            border: 0;
            background: transparent;
            font-size: 26px;
            cursor: pointer;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .header-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: #dff5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .header-title {
            font-weight: 700;
            font-size: 17px;
        }

        .online {
            color: #29a36a;
            font-size: 12px;
            margin-top: 2px;
        }

        /* CHAT */

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 120px;
        }

        .welcome {
            max-width: 650px;
            margin: 70px auto 30px;
            text-align: center;
        }

        .welcome-icon {
            width: 75px;
            height: 75px;
            border-radius: 25px;
            background: #dff5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: auto;
        }

        .welcome h1 {
            margin: 20px 0 8px;
            font-size: 28px;
        }

        .welcome p {
            color: #7b8495;
            line-height: 1.6;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 25px;
        }

        .card {
            border: 1px solid #e3e8ef;
            background: white;
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            font-size: 14px;
        }

        .card:hover {
            background: #f3fbff;
        }
