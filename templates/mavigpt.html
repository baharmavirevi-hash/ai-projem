<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MaviGPT</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef9ff;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 65px;
            background: white;
            border-bottom: 1px solid #dceaf0;
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: #d9f5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            font-size: 12px;
            color: #2ca66f;
            margin-top: 3px;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px 15px 110px;
        }

        .welcome {
            text-align: center;
            margin-top: 70px;
        }

        .welcome-logo {
            font-size: 60px;
        }

        .welcome h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #697586;
            line-height: 1.6;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 18px;
            display: flex;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-avatar {
            background: #dce7ff;
        }

        .bot-avatar {
            background: #d9f5ff;
        }

        .bubble {
            padding: 13px 16px;
            border-radius: 17px;
            line-height: 1.5;
            max-width: 100%;
            word-break: break-word;
        }

        .user-bubble {
            background: #dcecff;
        }

        .bot-bubble {
            background: white;
            border: 1px solid #dce5ea;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: rgba(238,249,255,.97);
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            min-height: 55px;
            background: white;
            border: 1px solid #d5e4ea;
            border-radius: 18px;
            display: flex;
            align-items: center;
            padding: 5px 7px;
        }

        .plus {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            color: #607080;
            cursor: pointer;
        }

        #mesaj {
            flex: 1;
            border: 0;
            outline: 0;
            font-size: 15px;
            padding: 10px;
            min-width: 0;
        }

        .send {
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 13px;
            background: #0782a8;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        @media (max-width: 600px) {

            .chat {
                padding: 20px 10px 100px;
            }

            .welcome {
                margin-top: 50px;
            }

            .welcome h1 {
                font-size: 22px;
            }

            .message {
                max-width: 100%;
            }

            .bubble {
                font-size: 14px;
            }

            .header {
                padding: 0 12px;
            }

        }

    </style>

</head>


<body>

<div class="app">


    <header class="header">

        <div class="logo">
            🩵
        </div>

        <div>

            <div class="title">
                MaviGPT
            </div>

            <div class="status">
                ● Çevrimiçi
            </div>

        </div>

    </header>


    <main class="chat">


        <div class="welcome">

            <div class="welcome-logo">
                🩵
            </div>

            <h1>
                Merhaba Bahar! 👋
            </h1>

            <p>
                Ben MaviGPT.
                <br>
                Sana nasıl yardımcı olabilirim?
            </p>

        </div>


        {% if mesaj %}

        <div class="message">

            <div class="avatar user-avatar">
                👤
            </div>

            <div>

                <div class="bubble user-bubble">
                    {{ mesaj }}
                </div>

            </div>

        </div>

        {% endif %}


        {% if cevap %}

        <div class="message">

            <div class="avatar bot-avatar">
                🩵
            </div>

            <div>

                <div class="bubble bot-bubble">
                    {{ cevap }}
                </div>

            </div>

        </div>

        {% endif %}


    </main>


    <form
        method="POST"
        enctype="multipart/form-data"
        class="input-area">

        <div class="input-box">

            <label
                for="photo"
                class="plus">
                ＋
            </label>

            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/*"
                hidden>

            <input
                type="text"
                id="mesaj"
                name="mesaj"
                placeholder="MaviGPT'ye mesaj gönder..."
                autocomplete="off">

            <button
                type="submit"
                class="send">
                ➤
            </button>

        </div>

    </form>


</div>

</body>

                </html>
