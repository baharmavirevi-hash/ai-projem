<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>MaviGPT</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f7f9fc;
            color: #17202a;

            overflow: hidden;
        }


        /* =========================================
           UYGULAMA
        ========================================= */

        .app {
            width: 100%;
            height: 100dvh;
            display: flex;
            position: relative;
        }


        /* =========================================
           KARARTMA
        ========================================= */

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.42);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

            z-index: 90;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }


        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {
            width: 285px;
            height: 100dvh;

            background: #ffffff;

            border-right: 1px solid #e7ebf0;

            display: flex;
            flex-direction: column;

            padding: 18px;

            position: fixed;
            top: 0;
            left: 0;

            transform: translateX(-105%);

            transition: transform 0.28s ease;

            z-index: 100;

            box-shadow:
                8px 0 30px rgba(20, 40, 70, 0.08);
        }

        .sidebar.active {
            transform: translateX(0);
        }


        /* =========================================
           SIDEBAR LOGO
        ========================================= */

        .sidebar-top {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 8px 8px 22px;
        }

        .logo-circle {
            width: 45px;
            height: 45px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e8f5ff;

            font-size: 25px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-text strong {
            font-size: 19px;
            color: #172b3a;
        }

        .logo-text span {
            font-size: 12px;
            color: #8492a0;
            margin-top: 2px;
        }


        /* =========================================
           YENİ SOHBET
        ========================================= */

        .new-chat {
            width: 100%;

            border: 1px solid #dbe8f2;

            background: #f5fbff;

            color: #1886d7;

            border-radius: 15px;

            padding: 13px 15px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            text-align: left;

            transition: 0.2s;
        }

        .new-chat:hover {
            background: #e9f6ff;
        }

        .new-chat:active {
            transform: scale(0.98);
        }


        /* =========================================
           MENÜ BAŞLIĞI
        ========================================= */

        .menu-title {
            font-size: 11px;
            font-weight: 800;

            color: #9aa7b4;

            letter-spacing: 1px;

            margin:
                28px 10px 10px;
        }


        /* =========================================
           MENÜ LİNKLERİ
        ========================================= */

        .menu-link {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 13px;

            padding: 13px 14px;

            margin-bottom: 5px;

            border-radius: 14px;

            text-decoration: none;

            color: #344452;

            font-size: 15px;
            font-weight: 600;

            transition: 0.2s;
        }

        .menu-link:hover {
            background: #f1f7fb;
        }

        .menu-link:active {
            transform: scale(0.98);
        }

        .menu-icon {
            width: 28px;

            display: flex;
            justify-content: center;

            font-size: 20px;
        }


        /* =========================================
           SOHBET GEÇMİŞİ
        ========================================= */

        .history-title {
            font-size: 11px;
            font-weight: 800;

            color: #9aa7b4;

            letter-spacing: 1px;

            margin:
                25px 10px 10px;
        }

        .history {
            overflow-y: auto;
            flex: 1;
        }

        .history-item {
            padding: 12px;

            border-radius: 12px;

            margin-bottom: 4px;

            color: #536270;

            font-size: 14px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #f4f7fa;
        }


        /* =========================================
           ALT BİLGİ
        ========================================= */

        .sidebar-bottom {
            border-top: 1px solid #edf0f3;

            padding-top: 15px;

            color: #8b98a5;

            font-size: 12px;

            text-align: center;
        }


        /* =========================================
           ANA CHAT
        ========================================= */

        .chat {
            width: 100%;
            height: 100dvh;

            display: flex;
            flex-direction: column;

            background:
                radial-gradient(
                    circle at top,
                    #eef8ff 0%,
                    #f7f9fc 38%,
                    #f7f9fc 100%
                );
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {
            height: 70px;

            display: flex;
            align-items: center;

            padding:
                0 18px;

            border-bottom:
                1px solid rgba(220, 228, 235, 0.8);

            background:
                rgba(255,255,255,0.78);

            backdrop-filter: blur(16px);

            position: relative;
            z-index: 20;
        }


        /* =========================================
           HAMBURGER
        ========================================= */

        .menu-button {
            width: 44px;
            height: 44px;

            border: none;

            border-radius: 14px;

            background: #ffffff;

            box-shadow:
                0 5px 18px rgba(30, 70, 100, 0.10);

            font-size: 23px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 12px;

            color: #263746;

            transition: 0.2s;
        }

        .menu-button:active {
            transform: scale(0.92);
        }


        /* =========================================
           HEADER YAZISI
        ========================================= */

        .header-info {
            display: flex;
            flex-direction: column;
        }

        .header-info h1 {
            font-size: 18px;

            font-weight: 800;

            color: #182b3a;
        }

        .header-info span {
            font-size: 12px;

            color: #81909e;

            margin-top: 2px;
        }


        /* =========================================
           MESAJ ALANI
        ========================================= */

        .messages {
            flex: 1;

            overflow-y: auto;

            padding:
                28px 18px 130px;

            width: 100%;
            max-width: 850px;

            margin: 0 auto;

            scroll-behavior: smooth;
        }


        /* =========================================
           KARŞILAMA
        ========================================= */

        .welcome-screen {
            min-height: 100%;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px 10px;
        }

        .welcome-icon {
            width: 75px;
            height: 75px;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    #dff3ff,
                    #eef9ff
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;

            box-shadow:
                0 12px 35px rgba(40, 150, 220, 0.12);

            margin-bottom: 20px;
        }

        .welcome-screen h2 {
            font-size: 29px;

            font-weight: 800;

            color: #172c3d;

            margin-bottom: 10px;
        }

        .welcome-screen p {
            max-width: 500px;

            font-size: 15px;

            line-height: 1.6;

            color: #778693;
        }


        /* =========================================
           MESAJLAR
        ========================================= */

        .message {
            width: 100%;

            display: flex;

            margin-bottom: 18px;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }


        .message-content {
            max-width: 78%;

            padding: 13px 16px;

            border-radius: 20px;

            font-size: 15px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-wrap: break-word;
        }

        .message.ai .message-content {
            background: #ffffff;

            border:
                1px solid #e6edf2;

            border-top-left-radius: 6px;

            color: #293b48;

            box-shadow:
                0 5px 18px rgba(30, 60, 80, 0.06);
        }

        .message.user .message-content {
            background:
                linear-gradient(
                    135deg,
                    #54afe9,
                    #3d9bd9
                );

            color: white;

            border-top-right-radius: 6px;

            box-shadow:
                0 7px 20px rgba(40, 145, 210, 0.20);
        }


        /* =========================================
           FOTOĞRAF
        ========================================= */

        .uploaded-image {
            max-width: 240px;

            width: 100%;

            border-radius: 16px;

            display: block;

            margin-bottom: 8px;

            border: 2px solid rgba(255,255,255,0.8);
        }


        /* =========================================
           ALT INPUT ALANI
        ========================================= */

        .input-wrapper {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            padding:
                12px 15px
                calc(12px + env(safe-area-inset-bottom));

            background:
                linear-gradient(
                    to top,
                    #f7f9fc 65%,
                    rgba(247,249,252,0.85)
                );

            z-index: 30;
        }

        .input-container {
            width: 100%;
            max-width: 850px;

            margin: auto;

            background: #ffffff;

            border:
                1px solid #dce6ed;

            border-radius: 22px;

            display: flex;
            align-items: center;

            padding: 6px;

            box-shadow:
                0 10px 35px rgba(30, 60, 90, 0.12);
        }


        /* =========================================
           FOTOĞRAF BUTONU
        ========================================= */

        .upload-button {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border: none;

            background: transparent;

            border-radius: 14px;

            font-size: 20px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.2s;
        }

        .upload-button:hover {
            background: #f0f6fa;
        }

        .upload-button:active {
            transform: scale(0.9);
        }


        /* =========================================
           INPUT
        ========================================= */

        .message-input {
            flex: 1;

            min-width: 0;

            border: none;
            outline: none;

            background: transparent;

            padding:
                11px 8px;

            font-size: 15px;

            color: #253643;
        }

        .message-input::placeholder {
            color: #9ba8b3;
        }


        /* =========================================
           GÖNDER
        ========================================= */

        .send-button {
            width: 44px;
            height: 44px;

            flex-shrink: 0;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #58b5ed,
                    #3d9cdb
                );

            color: white;

            font-size: 21px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 6px 16px rgba(45, 145, 210, 0.22);

            transition: 0.2s;
        }

        .send-button:active {
            transform: scale(0.9);
        }


        /* =========================================
           YAZIYOR ANİMASYONU
        ========================================= */

        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;

            background: #8ca0af;

            border-radius: 50%;

            animation:
                typing 1.2s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {

            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }


        /* =========================================
           MOBİL
        ========================================= */

        @media (max-width: 600px) {

            .sidebar {
                width: min(310px, 84vw);
            }

            .header {
                height: 64px;
                padding: 0 12px;
            }

            .menu-button {
                width: 42px;
                height: 42px;

                font-size: 21px;

                margin-right: 10px;
            }

            .header-info h1 {
                font-size: 17px;
            }

            .messages {
                padding:
                    20px
