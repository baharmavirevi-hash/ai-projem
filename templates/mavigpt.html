<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>MaviGPT</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="sidebar-brand">
                <div class="brand-logo">🩵</div>

                <div>
                    <div class="brand-title">
                        MaviGPT
                    </div>

                    <div class="brand-subtitle">
                        Senin yapay zekân
                    </div>
                </div>
            </div>

            <button
                class="close-button"
                type="button"
                onclick="closeSidebar()">
                ✕
            </button>

        </div>


        <button
            class="new-chat"
            type="button"
            onclick="newChat()">

            <span class="new-chat-icon">＋</span>
            <span>Yeni sohbet</span>

        </button>


        <div class="sidebar-section-title">
            SOHBETLER
        </div>


        <div class="history">

            {% if sohbetler %}

                {% for sohbet in sohbetler %}

                <button
                    class="history-item"
                    type="button">

                    <span class="history-icon">
                        💬
                    </span>

                    <span class="history-text">
                        {{ sohbet.mesaj if sohbet.mesaj else "Yeni sohbet" }}
                    </span>

                </button>

                {% endfor %}

            {% else %}

                <div class="empty-history">
                    Henüz sohbet yok.
                </div>

            {% endif %}

        </div>


        <div class="sidebar-bottom">

            <a href="/doctor" class="side-link">
                <span>🩺</span>
                <span>Cebimdeki Doktor</span>
            </a>

            <a href="/period" class="side-link">
                <span>🌸</span>
                <span>Regl Takibi</span>
            </a>

            <a href="/diarrhea" class="side-link">
                <span>📊</span>
                <span>Sindirim Takibi</span>
            </a>

        </div>

    </aside>


    <!-- ================= OVERLAY ================= -->

    <div
        class="overlay"
        id="overlay"
        onclick="closeSidebar()">
    </div>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <!-- HEADER -->

        <header class="header">

            <button
                class="menu-button"
                type="button"
                onclick="openSidebar()">
                ☰
            </button>


            <div class="header-info">

                <div class="header-logo">
                    🩵
                </div>

                <div>

                    <div class="header-title">
                        MaviGPT
                    </div>

                    <div class="online-status">
                        <span></span>
                        Çevrimiçi
                    </div>

                </div>

            </div>


            <button
                class="more-button"
                type="button">
                ⋮
            </button>

        </header>


        <!-- ================= CHAT ================= -->

        <section
            class="chat-area"
            id="chatArea">

            <div class="welcome">
