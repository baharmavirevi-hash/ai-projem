<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaviGPT - Ayarlar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f9fc;
            color: #17212b;
        }

        body {
            padding-bottom: 30px;
        }

        .top {
            height: 65px;
            background: white;
            border-bottom: 1px solid #dfe8ee;

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 0 12px;

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back {
            width: 44px;
            height: 44px;

            border: none;
            border-radius: 14px;

            background: #eef8fb;
            color: #14728d;

            font-size: 24px;
            cursor: pointer;
        }

        .logo {
            width: 43px;
            height: 43px;

            border-radius: 14px;
            background: #d9f5ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;
        }

        .title-area {
            min-width: 0;
        }

        .title {
            font-size: 17px;
            font-weight: bold;
        }

        .subtitle {
            margin-top: 3px;
            color: #84919a;
            font-size: 11px;
        }

        .container {
            width: 100%;
            max-width: 700px;

            margin: 0 auto;
            padding: 20px 14px 40px;
        }

        .page-title {
            margin: 5px 0 18px;

            font-size: 25px;
        }

        .card {
            background: white;

            border: 1px solid #dfe7eb;
            border-radius: 20px;

            padding: 18px;
            margin-bottom: 15px;

            box-shadow: 0 3px 12px rgba(0,0,0,.04);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 15px;

            font-size: 17px;
            font-weight: bold;
        }

        .card-icon {
            width: 38px;
            height: 38px;

            border-radius: 12px;

            background: #d9f5ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #52636d;

            font-size: 13px;
            font-weight: bold;
        }

        select {
            width: 100%;

            padding: 13px;

            border: 1px solid #d6e3e8;
            border-radius: 13px;

            background: #f9fcfd;

            font-size: 14px;
            outline: none;
        }

        select:focus {
            border-color: #7ccde5;
        }

        .field {
            margin-bottom: 17px;
        }

        .save-button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 15px;

            background: #0782a8;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .save-button:active {
            transform: scale(.98);
        }

        .message {
            padding: 12px 14px;

            margin-bottom: 15px;

            border-radius: 13px;

            background: #eaf9f0;
            color: #26734d;

            font-size: 14px;
        }

        /* =========================
           BİLDİRİM
        ========================= */

        .notification-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .notification-info {
            flex: 1;
            min-width: 0;
        }

        .notification-title {
            font-size: 15px;
            font-weight: bold;

            margin-bottom: 5px;
        }

        .notification-description {
            color: #7b8992;
            font-size: 13px;
            line-height: 1.5;
        }

        .switch {
            position: relative;

            width: 56px;
            min-width: 56px;
            height: 32px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;

            cursor: pointer;

            background: #cbd7dc;

            border-radius: 30px;

            transition: .2s;
        }

        .slider::before {
            content: "";

            position: absolute;

            width: 24px;
            height: 24px;

            left: 4px;
            top: 4px;

            background: white;

            border-radius: 50%;

            transition: .2s;

            box-shadow: 0 2px 5px rgba(0,0,0,.18);
        }

        .switch input:checked + .slider {
            background: #0782a8;
        }

        .switch input:checked + .slider::before {
            transform: translateX(24px);
        }

        .notification-status {
            margin-top: 14px;

            padding: 11px 13px;

            border-radius: 12px;

            background: #f4f9fc;

            color: #65757e;

            font-size: 12px;

            line-height: 1.5;
        }

        .test-button {
            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border: 1px solid #cfe4eb;
            border-radius: 13px;

            background: #eefaff;
            color: #087c9f;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .test-button:active {
            transform: scale(.98);
        }

        .warning {
            background: #fff8e8;
            color: #80651d;
        }

        .success {
            background: #eaf9f0;
            color: #26734d;
        }

        .error {
            background: #fff0f0;
            color: #a23d3d;
        }

        @media (max-width: 600px) {

            .container {
                padding: 16px 10px 30px;
            }

            .page-title {
                font-size: 23px;
            }

            .card {
                padding: 16px;
                border-radius: 18px;
            }

        }
    </style>
</head>

<body>

    <!-- =========================
         ÜST BAR
    ========================== -->

    <header class="top">

        <button
            class="back"
            type="button"
            onclick="window.location.href='/'">

            ←

        </button>

        <div class="logo">
            🩵
        </div>

        <div class="title-area">

            <div class="title">
                MaviGPT
            </div>

            <div class="subtitle">
                Ayarlar
            </div>

        </div>

    </header>


    <main class="container">

        <h1 class="page-title">
            ⚙️ Ayarlar
        </h1>


        {% if kayit_mesaji %}

            <div class="message">
                {{ kayit_mesaji }}
            </div>

        {% endif %}


        <!-- =========================
             BİLDİRİMLER
        ========================== -->

        <section class="card">

            <div class="card-title">

                <div class="card-icon">
                    🔔
                </div>

                Bildirimler

            </div>


            <div class="notification-row">

                <div class="notification-info">

                    <div class="notification-title">
                        MaviGPT bildirimleri
                    </div>

                    <div class="notification-description">
                        MaviGPT'nin cihazında bildirim göstermesine izin ver.
                        Abonelik veya hesap gerekmez.
                    </div>

                </div>


                <label class="switch">

                    <input
                        type="checkbox"
                        id="notificationToggle">

                    <span class="slider"></span>

                </label>

            </div>


            <div
                class="notification-status"
                id="notificationStatus">

                Bildirimler henüz etkinleştirilmedi.

            </div>


            <button
                class="test-button"
                id="testNotification"
                type="button">

                🔔 Test bildirimi gönder

            </button>

        </section>


        <!-- =========================
             MAVİGPT MODU
        ========================== -->

        <form
            method="POST"
            action="/settings">

            <section class="card">

                <div class="card-title">

                    <div class="card-icon">
                        🧠
                    </div>

                    MaviGPT modu

                </div>


                <div class="field">

                    <label for="mode">
                        Cevap tarzı
                    </label>

                    <select
                        id="mode"
                        name="mode">

                        <option
                            value="normal"
                            {% if settings.mode == "normal" %}selected{% endif %}>
                            Normal
                        </option>

                        <option
                            value="creative"
                            {% if settings.mode == "creative" %}selected{% endif %}>
                            Yaratıcı
                        </option>

                        <option
                            value="study"
                            {% if settings.mode == "study" %}selected{% endif %}>
                            Ders / Öğretmen
                        </option>

                        <option
                            value="concise"
                            {% if settings.mode == "concise" %}selected{% endif %}>
                            Kısa ve net
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label for="personality">
                        MaviGPT karakteri
                    </label>

                    <select
                        id="personality"
                        name="personality">

                        <option
                            value="friendly"
                            {% if settings.personality == "friendly" %}selected{% endif %}>
                            🩵 Samimi
                        </option>

                        <option
                            value="funny"
                            {% if settings.personality == "funny" %}selected{% endif %}>
                            😂 Eğlenceli
                        </option>

                        <option
                            value="serious"
                            {% if settings.personality == "serious" %}selected{% endif %}>
                            🧠 Ciddi
                        </option>

                        <option
                            value="teacher"
                            {% if settings.personality == "teacher" %}selected{% endif %}>
                            📚 Öğretmen
                        </option>

                    </select>

                </div>


                <button
                    class="save-button"
                    type="submit">

                    💾 Ayarları Kaydet

                </button>

            </section>

        </form>

    </main>


<script>
(function () {

    const toggle =
        document.getElementById("notificationToggle");

    const status =
        document.getElementById("notificationStatus");

    const testButton =
        document.getElementById("testNotification");


    /* =========================
       DURUM YAZISI
    ========================== */

    function showStatus(text, type) {

        status.textContent = text;

        status.classList.remove(
            "warning",
            "success",
            "error"
        );

        if (type) {
            status.classList.add(type);
        }
    }


    /* =========================
       SERVICE WORKER
    ========================== */

    async function registerServiceWorker() {

        if (!("serviceWorker" in navigator)) {

            showStatus(
                "Bu tarayıcı Service Worker desteklemiyor.",
                "error"
            );

            return null;
        }

        try {

            const registration =
                await navigator.serviceWorker.register(
                    "/service-worker.js"
                );

            await navigator.serviceWorker.ready;

            return registration;

        } catch (error) {

            console.error(
                "Service Worker hatası:",
                error
            );

            showStatus(
                "Bildirim sistemi başlatılamadı.",
                "error"
            );

            return null;
        }
    }


    /* =========================
       BİLDİRİM DURUMU
    ========================== */

    async function updateNotificationStatus() {

        if (!("Notification" in window)) {

            toggle.disabled = true;

            showStatus(
                "Bu tarayıcı bildirimleri desteklemiyor.",
                "error"
            );

            return;
        }


        if (Notification.permission === "granted") {

            toggle.checked = true;

            showStatus(
                "✅ Bildirimler açık.",
                "success"
            );

        } else if (Notification.permission === "denied") {

            toggle.checked = false;

            showStatus(
                "Bildirim izni kapalı. Tarayıcı ayarlarından tekrar açabilirsin.",
                "warning"
            );

        } else {

            toggle.checked = false;

            showStatus(
                "Bildirimler henüz etkinleştirilmedi.",
                ""
            );
        }
    }


    /* =========================
       BİLDİRİMİ AÇ
    ========================== */

    toggle.addEventListener(
        "change",
        async function () {

            if (!toggle.checked) {

                showStatus(
                    "Bildirimleri kapatmak için tarayıcı bildirim ayarlarını kullanabilirsin.",
                    "warning"
                );

                return;
            }


            if (!("Notification" in window)) {

                toggle.checked = false;

                showStatus(
                    "Tarayıcın bildirimleri desteklemiyor.",
                    "error"
                );

                return;
            }


            try {

                const permission =
                    await Notification.requestPermission();


                if (permission === "granted") {

                    await registerServiceWorker();

                    showStatus(
                        "✅ Bildirimler açıldı!",
                        "success"
                    );

                } else {

                    toggle.checked = false;

                    showStatus(
                        "Bildirim izni verilmedi.",
                        "warning"
                    );
                }

            } catch (error) {

                console.error(error);

                toggle.checked = false;

                showStatus(
                    "Bildirim izni alınırken hata oluştu.",
                    "error"
                );
            }

        }
    );


    /* =========================
       TEST BİLDİRİMİ
    ========================== */

    testButton.addEventListener(
        "click",
        async function () {

            if (!("Notification" in window)) {

                showStatus(
                    "Tarayıcın bildirimleri desteklemiyor.",
                    "error"
                );

                return;
            }


            if (Notification.permission !== "granted") {

                toggle.checked = true;

                const permission =
                    await Notification.requestPermission();

                if (permission !== "granted") {

                    toggle.checked = false;

                    showStatus(
                        "Önce bildirim izni vermen gerekiyor.",
                        "warning"
                    );

                    return;
                }
            }


            const registration =
                await registerServiceWorker();


            if (!registration) {
                return;
            }


            try {

                await registration.showNotification(
                    "🩵 MaviGPT",
                    {
                        body: "Bildirimler başarıyla çalışıyor! 🎉",
                        icon: "/static/icons/icon-192.png",
                        badge: "/static/icons/icon-192.png",
                        tag: "mavigpt-test"
                    }
                );

                showStatus(
                    "✅ Test bildirimi gönderildi!",
                    "success"
                );

            } catch (error) {

                console.error(error);

                showStatus(
                    "Test bildirimi gönderilemedi.",
                    "error"
                );
            }

        }
    );


    /* =========================
       SAYFA AÇILINCA
    ========================== */

    updateNotificationStatus();

})();
</script>

</body>
</html>
