<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#98daf5">

    <title>MaviGPT</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f5fbff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 1100px;
            height: 100vh;
            background: white;
            display: flex;
            overflow: hidden;
        }

        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            width: 260px;
            background: #eaf8ff;
            border-right: 1px solid #d8eef7;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2296c7;
            padding: 10px;
        }

        .new-chat {
            border: none;
            background: #98daf5;
            color: #12465b;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .menu-item {
            display: block;
            text-decoration: none;
            color: #315462;
            background: white;
            padding: 13px;
            border-radius: 12px;
            margin-top: 3px;
        }

        .menu-item:hover {
            background: #dff5ff;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            height: 65px;
            border-bottom: 1px solid #e5eef2;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
        }

        .menu-button {
            display: none;
            border: none;
            background: transparent;
            font-size: 25px;
            cursor: pointer;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            color: #238bb5;
        }

        .status {
            margin-left: auto;
            color: #38a169;
            font-size: 13px;
        }

        /* =====================================================
           CHAT
        ===================================================== */

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .welcome {
            max-width: 700px;
            margin: 80px auto;
            text-align: center;
        }

        .welcome-icon {
            font-size: 60px;
        }

        .welcome h1 {
            color: #248db8;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #6b7d84;
            line-height: 1.6;
        }

        .message {
            max-width: 760px;
            margin: 0 auto 18px auto;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 13px 16px;
            border-radius: 18px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background: #98daf5;
            color: #17495c;
            border-bottom-right-radius: 5px;
        }

        .message.bot .bubble {
            background: #f0f8fb;
            color: #304b55;
            border-bottom-left-radius: 5px;
        }

        /* =====================================================
           INPUT
        ===================================================== */

        .input-area {
            padding: 15px 20px 20px;
            border-top: 1px solid #e5eef2;
        }

        .input-box {
            max-width: 800px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f4fafc;
            border: 1px solid #d9edf4;
            border-radius: 20px;
            padding: 8px;
        }

        .input-box textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            font-size: 15px;
            padding: 10px;
            min-height: 42px;
            max-height: 120px;
        }

        .send-button {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: #98daf5;
            cursor: pointer;
            font-size: 19px;
        }

        .send-button:hover {
            background: #7dcdec;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .app {
                height: 100vh;
            }

            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100%;
                z-index: 1000;
                transition: left 0.25s ease;
                box-shadow: 5px 0 20px rgba(0,0,0,0.08);
            }

            .sidebar.open {
                left: 0;
            }

            .menu-button {
                display: block;
            }

            .status {
                font-size: 11px;
            }

            .chat-area {
                padding: 15px;
            }

            .welcome {
                margin: 60px auto;
            }

            .welcome-icon {
                font-size: 50px;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .bubble {
                max-width: 85%;
            }

            .input-area {
                padding: 10px;
            }
        }

    </style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            🩵 MaviGPT
        </div>

        <button
            class="new-chat"
            onclick="newChat()">
            ＋ Yeni sohbet
        </button>

        <a
            href="/"
            class="menu-item">
            💬 MaviGPT
        </a>

        <a
            href="/doctor"
            class="menu-item">
            🩺 Cebimdeki Doktor
        </a>

        <a
            href="/period"
            class="menu-item">
            📅 Regl Takibi
        </a>

        <a
            href="/diarrhea"
            class="menu-item">
            📝 Sindirim Takibi
        </a>

        <a
            href="/friends"
            class="menu-item">
            👥 Arkadaşlar
        </a>

        <div class="sidebar-bottom">

            <a
                href="/settings"
                class="menu-item">
                ⚙️ Ayarlar
            </a>

        </div>

    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">

        <header class="header">

            <button
                class="menu-button"
                onclick="toggleSidebar()">
                ☰
            </button>

            <div class="header-title">
                🩵 MaviGPT
            </div>

            <div class="status">
                ● Çevrimiçi
            </div>

        </header>


        <!-- =================================================
             CHAT AREA
        ================================================== -->

        <section
            class="chat-area"
            id="chatArea">

            <div
                class="welcome"
                id="welcome">

                <div class="welcome-icon">
                    🩵
                </div>

                <h1>
                    Merhaba! 👋
                </h1>

                <p>
                    Ben MaviGPT.
                    <br>
                    Sana yardımcı olmak için buradayım.
                </p>

            </div>

        </section>


        <!-- =================================================
             INPUT
        ================================================== -->

        <div class="input-area">

            <form
                class="input-box"
                id="chatForm">

                <textarea
                    id="messageInput"
                    placeholder="MaviGPT'ye bir şey sor..."
                    rows="1"></textarea>

                <button
                    class="send-button"
                    type="submit">
                    ➤
                </button>

            </form>

        </div>

    </main>

</div>


<script>

    /* =====================================================
       SIDEBAR
    ===================================================== */

    function toggleSidebar() {

        const sidebar =
            document.getElementById("sidebar");

        sidebar.classList.toggle("open");
    }


    /* =====================================================
       YENİ SOHBET
    ===================================================== */

    function newChat() {

        const chatArea =
            document.getElementById("chatArea");

        chatArea.innerHTML = `
            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    🩵
                </div>

                <h1>
                    Yeni sohbet 👋
                </h1>

                <p>
                    Yeni bir konuşmaya başlayabilirsin.
                </p>

            </div>
        `;

        document
            .getElementById("messageInput")
            .focus();
    }


    /* =====================================================
       MESAJ EKLE
    ===================================================== */

    function addMessage(text, type) {

        const chatArea =
            document.getElementById("chatArea");

        const welcome =
            document.getElementById("welcome");

        if (welcome) {
            welcome.remove();
        }

        const message =
            document.createElement("div");

        message.className =
            "message " + type;

        const bubble =
            document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = text;

        message.appendChild(bubble);

        chatArea.appendChild(message);

        chatArea.scrollTop =
            chatArea.scrollHeight;
    }


    /* =====================================================
       FORM
    ===================================================== */

    document
        .getElementById("chatForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const input =
                    document.getElementById(
                        "messageInput"
                    );

                const message =
                    input.value.trim();

                if (!message) {
                    return;
                }

                addMessage(
                    message,
                    "user"
                );

                input.value = "";

                addMessage(
                    "MaviGPT düşünüyor... 🩵",
                    "bot"
                );

                try {

                    const response =
                        await fetch(
                            "/send",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    message: message
                                })
                            }
                        );

                    const data =
                        await response.json();

                    const chatArea =
                        document.getElementById(
                            "chatArea"
                        );

                    const thinking =
                        chatArea.lastElementChild;

                    if (
                        thinking &&
                        thinking.classList.contains("bot")
                    ) {

                        thinking.remove();
                    }

                    addMessage(
                        data.response ||
                        data.reply ||
                        data.message ||
                        "Bir cevap alınamadı.",
                        "bot"
                    );

                } catch (error) {

                    const chatArea =
                        document.getElementById(
                            "chatArea"
                        );

                    const thinking =
                        chatArea.lastElementChild;

                    if (
                        thinking &&
                        thinking.classList.contains("bot")
                    ) {

                        thinking.remove();
                    }

                    addMessage(
                        "Bağlantıda bir sorun oluştu. 🩵",
                        "bot"
                    );

                    console.error(error);
                }

            }
        );


    /* =====================================================
       ENTER = GÖNDER
       SHIFT + ENTER = ALT SATIR
    ===================================================== */

    document
        .getElementById("messageInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    document
                        .getElementById("chatForm")
                        .requestSubmit();
                }

            }
        );

</script>

</body>
</html>
