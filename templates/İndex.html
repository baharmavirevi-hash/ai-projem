<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

    <meta name="theme-color" content="#98daf5">

    <meta name="description" content="MaviGPT - Kişisel yapay zeka asistanın">

    <title>Cebimdeki Doktor - MaviGPT</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #eef8ff;
        }

        /* Üst bar */

        .top-bar {
            height: 65px;
            background: #7dc9ff;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            gap: 15px;
            color: white;
        }

        .menu-btn {
            font-size: 30px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }

        /* Menü */

        .side-menu {
            position: fixed;
            left: -280px;
            top: 0;
            width: 270px;
            height: 100%;
            background: white;
            padding: 20px;
            transition: .3s;
            z-index: 5;
            box-shadow: 4px 0 15px rgba(0,0,0,.15);
        }

        .side-menu.active {
            left: 0;
        }

        .side-menu button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 15px;
            background: #e7f5ff;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
        }

        /* Karartma */

        #overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.3);
            z-index: 4;
        }

        #overlay.active {
            display: block;
        }

        /* Sohbet */

        .chat {
            padding: 20px;
            height: calc(100vh - 130px);
            overflow-y: auto;
        }

        .bot {
            background: white;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 15px;
            max-width: 85%;
            box-shadow: 0 3px 10px rgba(0,0,0,.05);
        }

        /* Yazma alanı */

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            padding: 10px;
            background: white;
            box-shadow: 0 -2px 10px rgba(0,0,0,.08);
        }

        .input-area input {
            flex: 1;
            padding: 14px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 15px;
        }

        .input-area input:focus {
            border-color: #70c5ff;
        }

        .input-area button {
            margin-left: 10px;
            border: none;
            border-radius: 20px;
            padding: 12px 18px;
            background: #70c5ff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <!-- Üst bar -->

    <div class="top-bar">

        <button class="menu-btn" onclick="menuAc()">☰</button>

        <h2>🩺 Cebimdeki Doktor</h2>

    </div>


    <!-- Menü -->

    <div id="side-menu" class="side-menu">

        <h2>🩺 Menü</h2>

        <button>➕ Yeni Sohbet</button>

        <button>💬 Sohbet Geçmişi</button>

        <button>📅 Regl Takibi</button>

        <button>📝 Belirti Takibi</button>

        <button>📷 Fotoğraf Yükle</button>

        <button>⚙️ Ayarlar</button>

    </div>


    <!-- Karartma -->

    <div id="overlay" onclick="menuAc()"></div>


    <!-- Sohbet -->

    <div class="chat">

        <div class="bot">

            👋 Merhaba Bahar!

            <br><br>

            Ben <b>Cebimdeki Doktor</b>.

            <br><br>

            Belirtilerini yazabilirsin.

            Sana genel sağlık bilgileri ve öneriler sunabilirim.

            <br><br>

            ⚠️ Verdiğim bilgiler genel bilgilendirme amaçlıdır.

        </div>

    </div>


    <!-- Yazma alanı -->

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Belirtilerini yaz..."
        >

        <button onclick="mesajGonder()">➤</button>

    </div>


    <script>

        function menuAc() {

            const menu = document.getElementById("side-menu");
            const overlay = document.getElementById("overlay");

            menu.classList.toggle("active");
            overlay.classList.toggle("active");

        }


        function mesajGonder() {

            const input = document.getElementById("messageInput");

            const mesaj = input.value.trim();

            if (!mesaj) {
                return;
            }

            alert("Mesaj alındı: " + mesaj);

            input.value = "";

        }


        /* Enter ile mesaj gönder */

        document.getElementById("messageInput").addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                mesajGonder();
            }

        });


        /* PWA Service Worker */

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", function() {

                navigator.serviceWorker.register("/static/service-worker.js")
                    .then(function() {
                        console.log("MaviGPT Service Worker aktif.");
                    })
                    .catch(function(error) {
                        console.log("Service Worker hatası:", error);
                    });

            });

        }

    </script>

</body>

    </html>
