<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arkadaş Sohbeti | MaviGPT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eefaff;
            color: #234;
        }

        .app {
            max-width: 900px;
            margin: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .header {
            background: #98daf5;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #123;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .room-code {
            font-size: 13px;
            background: rgba(255,255,255,.7);
            padding: 7px 10px;
            border-radius: 10px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f7fcff;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 13px;
            border-radius: 15px;
            background: #e2f6ff;
            max-width: 80%;
        }

        .username {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #1684ad;
        }

        .message-text {
            word-wrap: break-word;
        }

        .bottom {
            padding: 10px;
            border-top: 1px solid #ddd;
            background: white;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #c8dfe8;
            border-radius: 14px;
            outline: none;
        }

        button {
            border: none;
            border-radius: 13px;
            padding: 11px 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .send-btn {
            background: #98daf5;
        }

        .photo-btn {
            background: #e8f7ff;
        }

        .video-btn {
            width: 100%;
            margin-bottom: 9px;
            background: #d9f5e5;
            color: #176b3a;
        }

        /* =====================================================
           GÖRÜNTÜLÜ KONUŞMA
        ===================================================== */

        .video-panel {
            display: none;
            background: #111;
            padding: 10px;
            position: relative;
        }

        .video-panel.active {
            display: block;
        }

        .videos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        video {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #222;
            border-radius: 12px;
        }

        .video-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .video-controls button {
            background: white;
        }

        .end-call {
            background: #ff6969 !important;
            color: white;
        }

        .status {
            color: white;
            text-align: center;
            font-size: 13px;
            margin-bottom: 7px;
        }

        @media (max-width: 600px) {

            .app {
                width: 100%;
            }

            video {
                height: 170px;
            }

            .videos {
                grid-template-columns: 1fr;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         ÜST BAR
    ====================================================== -->

    <div class="header">

        <h2>👥 Arkadaş Sohbeti</h2>

        <div class="room-code">
            Kod: {{ room_code }}
        </div>

    </div>


    <!-- =====================================================
         GÖRÜNTÜLÜ KONUŞMA ALANI
    ====================================================== -->

    <div id="videoPanel" class="video-panel">

        <div id="callStatus" class="status">
            Görüntülü konuşma hazırlanıyor...
        </div>

        <div class="videos">

            <video
                id="localVideo"
                autoplay
                muted
                playsinline>
            </video>

            <video
                id="remoteVideo"
                autoplay
                playsinline>
            </video>

        </div>

        <div class="video-controls">

            <button onclick="toggleMicrophone()">
                🎤 Mikrofon
            </button>

            <button onclick="toggleCamera()">
                📷 Kamera
            </button>

            <button
                class="end-call"
                onclick="endCall()">
                🔴 Bitir
            </button>

        </div>

    </div>


    <!-- =====================================================
         MESAJLAR
    ====================================================== -->

    <div id="messages" class="messages">

        {% if messages %}

            {% for msg in messages %}

                <div class="message">

                    <div class="username">
                        {{ msg.username }}
                    </div>

                    <div class="message-text">
                        {{ msg.message }}
                    </div>

                </div>

            {% endfor %}

        {% else %}

            <div style="text-align:center; margin-top:40px;">
                💬 Henüz mesaj yok.
                <br>
                İlk mesajı sen gönder!
            </div>

        {% endif %}

    </div>


    <!-- =====================================================
         ALT ALAN
    ====================================================== -->

    <div class="bottom">

        <!-- GÖRÜNTÜLÜ KONUŞMA BUTONU -->

        <button
            id="videoCallButton"
            class="video-btn"
            onclick="startCall()">

            🎥 Görüntülü Konuş

        </button>


        <!-- MESAJ FORMU -->

        <form
            method="POST"
            enctype="multipart/form-data">

            <div class="input-row">

                <input
                    type="text"
                    name="username"
                    placeholder="Adın"
                    required>

                <input
                    type="text"
                    name="message"
                    placeholder="Mesaj yaz..."
                    autocomplete="off"
                    required>

                <button
                    type="submit"
                    class="send-btn">

                    Gönder

                </button>

            </div>

        </form>

    </div>

</div>


<script>

/* =========================================================
   GÖRÜNTÜLÜ KONUŞMA DEĞİŞKENLERİ
========================================================= */

let localStream = null;
let peerConnection = null;

const videoPanel =
    document.getElementById("videoPanel");

const localVideo =
    document.getElementById("localVideo");

const remoteVideo =
    document.getElementById("remoteVideo");

const callStatus =
    document.getElementById("callStatus");


/* =========================================================
   WEBRTC AYARLARI
========================================================= */

const rtcConfig = {

    iceServers: [

        {
            urls: "stun:stun.l.google.com:19302"
        },

        {
            urls: "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================================
   GÖRÜNTÜLÜ KONUŞMAYI BAŞLAT
========================================================= */

async function startCall() {

    try {

        videoPanel.classList.add("active");

        callStatus.textContent =
            "📷 Kamera ve mikrofon açılıyor...";

        localStream =
            await navigator.mediaDevices.getUserMedia({

                video: true,
                audio: true

            });

        localVideo.srcObject =
            localStream;


        peerConnection =
            new RTCPeerConnection(
                rtcConfig
            );


        localStream
            .getTracks()
            .forEach(track => {

                peerConnection.addTrack(
                    track,
                    localStream
                );

            });


        peerConnection.ontrack =
            event => {

                remoteVideo.srcObject =
                    event.streams[0];

            };


        callStatus.textContent =
            "🟢 Kamera açık. Arkadaşın bağlanması bekleniyor.";

    }

    catch (error) {

        console.error(error);

        callStatus.textContent =
            "❌ Kamera veya mikrofon açılamadı.";

        alert(
            "Kamera ve mikrofon izni vermen gerekiyor."
        );

    }

}


/* =========================================================
   MİKROFON
========================================================= */

function toggleMicrophone() {

    if (!localStream) {
        return;
    }

    const audioTracks =
        localStream.getAudioTracks();

    audioTracks.forEach(track => {

        track.enabled =
            !track.enabled;

    });

}


/* =========================================================
   KAMERA
========================================================= */

function toggleCamera() {

    if (!localStream) {
        return;
    }

    const videoTracks =
        localStream.getVideoTracks();

    videoTracks.forEach(track => {

        track.enabled =
            !track.enabled;

    });

}


/* =========================================================
   GÖRÜŞMEYİ BİTİR
========================================================= */

function endCall() {

    if (localStream) {

        localStream
            .getTracks()
            .forEach(track => {

                track.stop();

            });

        localStream = null;

    }


    if (peerConnection) {

        peerConnection.close();

        peerConnection = null;

    }


    localVideo.srcObject = null;
    remoteVideo.srcObject = null;

    videoPanel.classList.remove(
        "active"
    );

}


/* =========================================================
   SAYFAYI OTOMATİK YENİLEME
========================================================= */

setInterval(() => {

    if (
        !document.activeElement ||
        document.activeElement.tagName !== "INPUT"
    ) {

        location.reload();

    }

}, 5000);

</script>

</body>
</html>
